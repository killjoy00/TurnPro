<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Turn Pro · Basketball</title>
  <!-- styles -->
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <h1>TURN <em>PRO</em></h1>
      <span class="mode">Basketball <span>5-on-5</span></span>
      <button id="restart" class="restart" type="button">New match</button>
    </div>
  </header>
  <main>
    <section id="scoreboard" class="scoreboard" aria-label="Scoreboard" aria-live="polite"></section>
    <div class="match-layout">
      <section aria-labelledby="court-title" class="court-section">
        <div class="section-bar">
          <h2 id="court-title">Half court</h2>
          <span id="possession" class="possession"></span>
        </div>
        <p id="summary" class="summary" role="status"></p>
        <div class="court">
          <canvas id="court-lines" width="700" height="520" aria-hidden="true"></canvas>
          <div id="markers" class="markers" aria-label="Athletes on court"></div>
        </div>
        <div id="lineup" class="lineup" aria-label="Comets lineup"></div>
      </section>
      <aside aria-labelledby="plan-title" class="plan">
        <div class="section-bar">
          <h2 id="plan-title">Your plan</h2>
          <span id="budget" class="budget"></span>
        </div>
        <div id="orders" class="orders" aria-label="Queued commands"></div>
        <div id="actions" class="actions"></div>
        <div class="commit-area">
          <button id="commit" class="commit" type="button">Commit turn <span aria-hidden="true">→</span></button>
          <p id="commit-note" class="commit-note">Both teams reveal after you commit.</p>
        </div>
      </aside>
    </div>
    <section class="history" aria-labelledby="history-title">
      <div class="section-bar">
        <h2 id="history-title">Play-by-play</h2>
      </div>
      <div id="turns"></div>
    </section>
  </main>
  <!-- game -->
</body>
</html>
